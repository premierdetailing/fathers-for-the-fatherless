<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300"> <!-- Gold outer ring --> <circle cx="150" cy="150" r="145" fill="#F89104"/> <!-- Navy inner circle --> <circle cx="150" cy="150" r="126" fill="#304064"/> <!-- Cross on hilltop (right side) --> <!-- Hill --> <ellipse cx="195" cy="175" rx="38" ry="20" fill="white" opacity="0.95"/> <!-- Cross vertical --> <rect x="190" y="118" width="10" height="62" rx="2" fill="white"/> <!-- Cross horizontal --> <rect x="174" y="136" width="42" height="10" rx="2" fill="white"/> <!-- Adult figure (left, taller) --> <!-- Head --> <circle cx="108" cy="128" r="16" fill="white"/> <!-- Body --> <rect x="99" y="144" width="18" height="42" rx="6" fill="white"/> <!-- Arm reaching toward child --> <rect x="117" y="148" width="22" height="8" rx="4" fill="white"/> <!-- Child figure (right of adult, shorter) --> <!-- Head --> <circle cx="148" cy="138" r="11" fill="white"/> <!-- Body --> <rect x="141" y="149" width="14" height="30" rx="5" fill="white"/> <!-- Ministry name text --> <text x="150" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1.5">FATHERS FOR THE FATHERLESS</text> <!-- Tagline --> <text x="150" y="268" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-style="italic" fill="#F89104" text-anchor="middle" letter-spacing="0.5">This is What Hope Looks Like</text>
</svg>
